name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      bundle_chromium:
        description: "Bundle Chromium inside installer for offline PCs (~200 MB larger)"
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]
    paths:
      - "archiver.py"
      - "app_server.py"
      - "desktop_app.py"
      - "web/**"
      - "requirements.txt"
      - "news_archiver.spec"
      - "installer/news_archiver.iss"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Playwright Chromium (when bundling)
        if: ${{ inputs.bundle_chromium == true }}
        shell: cmd
        run: |
          set PLAYWRIGHT_BROWSERS_PATH=%CD%\build-browsers
          playwright install chromium
          echo NEWS_ARCHIVER_PLAYWRIGHT_DIR=%CD%\build-browsers>> %GITHUB_ENV%

      - name: Build Windows executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm news_archiver.spec

      - name: Build Inno Setup installer
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\news_archiver.iss

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist\NewsArchiver\* -DestinationPath dist\NewsArchiver-Portable-Windows.zip

      - name: Upload Windows Installer & Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NewsArchiver-Windows
          path: |
            dist/installer/NewsArchiver-Setup.exe
            dist/NewsArchiver-Portable-Windows.zip
